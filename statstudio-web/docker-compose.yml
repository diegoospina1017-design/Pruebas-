services:
  backend:
    build: ./backend
    container_name: statstudio-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./samples:/samples:ro
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: statstudio-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
