name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./statstudio-web/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: statstudio-web/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q
      - name: Validate backend starts
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8765 &
          SERVER_PID=$!
          sleep 4
          curl --fail http://127.0.0.1:8765/api/health
          kill $SERVER_PID

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./statstudio-web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: statstudio-web/frontend/package.json
      - run: npm install --no-audit --no-fund
      - name: Vitest
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: statstudio-web/frontend/dist

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: ./statstudio-web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: statstudio-web/frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: ./statstudio-web/backend
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          sleep 4
          curl --fail http://127.0.0.1:8000/api/health
      - name: Playwright
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: statstudio-web/frontend/playwright-report
